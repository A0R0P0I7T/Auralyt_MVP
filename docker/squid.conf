# Squid configuration for Auralyt Egress Proxy
# Blocks RFC 1918, RFC 3927, Loopback, Cloud Metadata, and non-standard web ports.

http_port 3128

# Define allowed destination web ports
acl Safe_ports port 80 443 8080 8443
acl SSL_ports port 443 8443

# Deny requests to unknown ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Define prohibited destination networks (SSRF defense)
acl prohibited_networks dst 127.0.0.0/8
acl prohibited_networks dst 10.0.0.0/8
acl prohibited_networks dst 172.16.0.0/12
acl prohibited_networks dst 192.168.0.0/16
acl prohibited_networks dst 169.254.0.0/16
acl prohibited_networks dst 100.64.0.0/10
acl prohibited_networks dst 0.0.0.0/8
acl prohibited_networks dst ::1/128
acl prohibited_networks dst fe80::/10
acl prohibited_networks dst fc00::/7

# Deny any connection to prohibited networks at connection time
http_access deny prohibited_networks

# Allow authenticated or local internal clients to access public web destinations
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
http_access allow localnet
http_access allow localhost

# Default deny
http_access deny all

# Forwarded headers & privacy
forwarded_for delete
via off
